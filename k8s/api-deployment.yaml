apiVersion: apps/v1
kind: Deployment
metadata:
  name: financial-monitor-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: financial-monitor-api
  template:
    metadata:
      labels:
        app: financial-monitor-api
    spec:
      containers:
        - name: api
          image: financial-monitor-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ConnectionStrings__Redis
              value: redis:6379
---
apiVersion: v1
kind: Service
metadata:
  name: financial-monitor-api
spec:
  selector:
    app: financial-monitor-api
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP